# Render Blueprint — deploys the One-In-All (momo) Rail portal + API as a Node web service.
# Postgres-backed: persistent ledger + DB-managed admin users (admin_users table).
databases:
  - name: momo-postgres
    databaseName: momo_rail
    user: momo
    plan: basic-256mb   # cheapest paid Render Postgres (~$6/mo); free slot is taken by mup-postgres

services:
  - type: web
    name: momo-rail
    runtime: node
    plan: starter   # Free tier failed to build/boot; Starter keeps momo always-on (~$7/mo)
    buildCommand: npm install && npm run build
    startCommand: node dist/src/api/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Postgres durability — enables persistent ledger + DB-backed admin auth.
      - key: DATABASE_URL
        fromDatabase:
          name: momo-postgres
          property: connectionString
      # Stable session-signing secret so admin/customer sessions survive restarts.
      - { key: AUTH_SECRET, generateValue: true }
