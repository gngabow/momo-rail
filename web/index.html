<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-In-All Rail — Wallet</title>
<link href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" rel="stylesheet">
<style>
  :root{--brand:#0F5B52;--brand2:#0A3B36;--gold:#F2B705;--ink:#12332E;--muted:#5B6470;
        --line:#E6E3DA;--bg:#F6F5F0;--card:#FFFFFF;--ok:#0F7B52;--bad:#B23A3A;--ice:#E7F1EF;}
  *{box-sizing:border-box;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;background:var(--bg);color:var(--ink)}
  .top{background:var(--brand2);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:1.05rem}.brand .swap{color:var(--gold)}
  .tag{font-size:.62rem;background:#11534b;color:#bfe4dc;padding:2px 8px;border-radius:20px;margin-left:6px}
  .top .spacer{flex:1}
  .lnk{background:transparent;border:1px solid #1c5f56;color:#cfe7e1;border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:.85rem}
  .lnk:hover{background:#0e463f}
  .csel{display:flex;align-items:center;gap:8px;background:#0e463f;border:1px solid #1c5f56;border-radius:10px;padding:5px 10px}
  .csel .fi{width:24px;height:18px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .csel select{background:transparent;color:#fff;border:none;font-size:.9rem;outline:none}
  .csel select option{color:#111}
  .wrap{max-width:960px;margin:18px auto;padding:0 16px}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:20px;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .bal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .bal .lab{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .bal .amt{font-size:1.9rem;font-weight:800;margin-top:4px}
  .bal .amt small{font-size:.9rem;color:var(--muted);font-weight:600}
  .bal.usdt{background:linear-gradient(135deg,#0F5B52,#0A3B36);color:#fff;border:none}
  .bal.usdt .lab{color:#bfe4dc}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .actions button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;cursor:pointer;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
  .actions button:hover{border-color:var(--brand);color:var(--brand)}.actions .ic{font-size:1.3rem}
  h3{margin:0 0 8px;font-size:1rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #f0efe9;font-size:.9rem}
  .row:first-child{border-top:none}.muted{color:var(--muted)}.small{font-size:.8rem}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #f0efe9}
  th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase}
  td .fi{width:22px;height:16px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
  .pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--ice);color:var(--brand)}
  .pill.cfg{background:#FFF6E5;color:#8A5A00}.pill.off{background:#FBE9E9;color:#B23A3A}
  .pill.res{background:#FFF6E5;color:#8A5A00}.pill.cl{background:#E7F4EC;color:#0F7B52}
  .backdrop{position:fixed;inset:0;background:rgba(10,20,25,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
  .modal h3{font-size:1.15rem}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
  input,select.inp,.seg{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff}
  .seg{display:flex;gap:6px;padding:4px}
  .seg button{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff}
  .quote{background:var(--ice);border-radius:10px;padding:12px;margin-top:12px;font-size:.9rem}
  .quote .qr{display:flex;justify-content:space-between;padding:3px 0}
  .quote .qr.tot{border-top:1px solid #cfe3dd;margin-top:6px;padding-top:8px;font-weight:800}
  .btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:1rem;cursor:pointer;margin-top:14px}
  .btn.sec{background:#fff;color:var(--muted);border:1px solid var(--line);margin-top:8px}
  .btn:disabled{opacity:.6}
  .msg{border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:10px}
  .msg.ok{background:#E7F4EC;color:#0F7B52}.msg.err{background:#FBE9E9;color:#B23A3A}
  .payrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
  .payrow input{padding:8px}.payrow button{border:none;background:#f0efe9;border-radius:8px;padding:0 10px;cursor:pointer}
  .foot{max-width:960px;margin:8px auto 30px;padding:0 16px;color:var(--muted);font-size:.75rem;line-height:1.5}
  .aedit{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
  .switch{display:inline-block}
  .fieldbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
  .fieldbox:focus-within{border-color:var(--brand)}
  .fieldbox .fi{width:28px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
  .fieldbox select,.fieldbox input{flex:1;border:none;outline:none;background:transparent;padding:12px 0;font-size:1rem;color:var(--ink)}
  .fieldbox .prefix{color:var(--muted);font-weight:700;flex:none}
  .fieldbox .chev{color:var(--muted);flex:none;pointer-events:none;margin-left:-6px}
  .tl{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.14);max-height:244px;overflow:auto;z-index:8}
  .tlrow{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:.92rem;border-top:1px solid #f2f1ec}
  .tlrow:first-child{border-top:none}.tlrow:hover{background:var(--ice)}
  .tlrow .fi{width:24px;height:17px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1);flex:none}
  .tlrow .d{color:var(--muted);margin-left:auto;font-size:.85rem;white-space:nowrap}
  .tlrow .usdtt{font-size:.58rem;font-weight:700;background:#DDEBEA;color:#1F7E77;padding:1px 6px;border-radius:20px;margin-left:6px}
  @media(max-width:640px){.actions{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">One-In-All Rail <span class="swap">⇄</span> <span class="tag" id="modeTag">live API</span></div>
  <div class="spacer"></div>
  <div id="authbox"></div>
  <div class="csel" id="csel" style="display:none"><span class="fi" id="topFlag"></span><select id="country"></select></div>
</div>
<div class="wrap">
  <div id="view"><div class="panel muted">Loading…</div></div>
</div>
<div class="foot" id="foot"></div>
<div id="modalRoot"></div>
<script>
const SCALE0=new Set(['UGX','XOF','XAF','RWF','GNF']);
const scaleOf=c=>SCALE0.has(c)?0:2;
const fmt=(n,ccy)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:scaleOf(ccy),maximumFractionDigits:scaleOf(ccy)});
const fmtU=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// stable per-browser id (used when signed out), plus optional auth session
let CID=localStorage.getItem('momo_cid');
if(!CID){CID='c-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('momo_cid',CID);}
let TOKEN=localStorage.getItem('momo_tok')||'';
let ADMIN=localStorage.getItem('momo_admin')||'';
let ME=JSON.parse(localStorage.getItem('momo_me')||'null');

// Demo admin credentials pre-filled on the Admin tab (must match the server's
// ADMIN_USERNAME / ADMIN_PASSWORD). Demo convenience only — remove the pre-fill
// for a real deployment.
const DEMO_ADMIN={u:'admin',p:'MomoRail2026!'};
const state={cc:'UG',view:'wallet',markets:[],wallet:null,activity:[],admin:[]};
// Curated international remitter/employer countries (non-Opco → USDT accounts).
const INTL_COUNTRIES=[
  {code:'GB',name:'United Kingdom',dial:'44'},{code:'US',name:'United States',dial:'1'},
  {code:'CA',name:'Canada',dial:'1'},{code:'AE',name:'United Arab Emirates',dial:'971'},
  {code:'SA',name:'Saudi Arabia',dial:'966'},{code:'QA',name:'Qatar',dial:'974'},
  {code:'DE',name:'Germany',dial:'49'},{code:'FR',name:'France',dial:'33'},
  {code:'NL',name:'Netherlands',dial:'31'},{code:'IT',name:'Italy',dial:'39'},
  {code:'SE',name:'Sweden',dial:'46'},{code:'AU',name:'Australia',dial:'61'},
  {code:'IN',name:'India',dial:'91'},{code:'CN',name:'China',dial:'86'},
].map(c=>({...c,type:'intl'}));
async function api(path,opts){opts=opts||{};const headers=Object.assign({},opts.headers);
  if(TOKEN&&!headers.Authorization)headers.Authorization='Bearer '+TOKEN;
  const r=await fetch(path,Object.assign({},opts,{headers}));const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;}
const POST=(path,body,headers)=>api(path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},headers||{}),body:JSON.stringify(body)});

async function loadMarkets(){
  state.markets=await api('/api/markets');
  const en=state.markets.filter(m=>m.enabled);
  const sel=document.getElementById('country');
  sel.innerHTML=en.map(m=>`<option value="${m.code}">${m.name} · ${m.ccy}</option>`).join('');
  if(!en.find(m=>m.code===state.cc)&&en[0])state.cc=en[0].code;
  sel.value=state.cc;
}
async function loadWallet(){ state.wallet=await api(`/api/wallet?customer=${CID}&country=${state.cc}`); }
async function loadActivity(){ state.activity=await api(`/api/activity?customer=${CID}`); }

const view=document.getElementById('view');
const cselEl=document.getElementById('csel');

// Top-level router: admin console, signed-in customer wallet, or the sign-in gate.
function route(){
  renderAuth();
  if(ADMIN){ cselEl.style.display='none'; renderAdmin(); return; }
  if(TOKEN&&ME){ if(ME.intl){ cselEl.style.display='none'; enterIntl(); } else { cselEl.style.display='flex'; enterApp(); } return; }
  cselEl.style.display='none'; renderGate();
}
async function enterApp(){ try{ await loadWallet(); await loadActivity(); renderWallet(); }catch(e){ clearCustomer(); route(); } }
async function enterIntl(){ try{ const w=await api(`/api/usdt-balance?customer=${CID}`); state.usdt=w.usdt; state.activity=await api(`/api/activity?customer=${CID}`); renderIntlHome(); }catch(e){ clearCustomer(); route(); } }
async function refresh(){ if(ADMIN){renderAdmin();return;} if(TOKEN&&ME){ if(ME.intl){await enterIntl();} else {await loadWallet();await loadActivity();renderWallet();} } else {route();} }
function renderAuth(){
  const el=document.getElementById('authbox');
  if(ADMIN){el.innerHTML=`<span class="small" style="color:#bfe4dc">🛠 Admin</span> <button class="lnk" id="so">Sign out</button>`;el.querySelector('#so').onclick=adminSignOut;return;}
  if(TOKEN&&ME){el.innerHTML=`<span class="small" style="color:#bfe4dc">📱 +${ME.msisdn}</span> <button class="lnk" id="so">Sign out</button>`;el.querySelector('#so').onclick=signOut;return;}
  el.innerHTML='';
}
// ---- Sign-in gate (the landing screen) ----
function renderGate(){
  const enabled=state.markets.filter(m=>m.enabled);
  if(!enabled.length){ view.innerHTML=`<div class="panel" style="max-width:440px;margin:5vh auto 0"><h3>No markets are live</h3><div class="small muted">An operator needs to enable a market from the ops console before customers can sign in.</div><div id="gadmin" style="margin-top:18px;background:var(--brand2);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;font-weight:800;cursor:pointer">Ops team? Admin sign-in →</div></div>`; document.getElementById('gadmin').onclick=e=>{e.preventDefault();adminLogin();}; return; }
  // Directory: enabled Opcos (local wallet) + curated remitter countries (USDT).
  const DIR=[
    ...enabled.map(m=>({code:m.code,name:m.name,dial:m.dial,type:'opco'})),
    ...INTL_COUNTRIES,
  ];
  view.innerHTML=`<div class="panel" style="max-width:440px;margin:5vh auto 0">
    <h3>Sign in to your wallet</h3>
    <div class="small muted">Start typing your country, pick it, then enter your number. In an MTN market you get a local wallet; elsewhere (employers &amp; remitters) a USDT account.</div>
    <label>Country</label>
    <div style="position:relative">
      <div class="fieldbox"><span class="fi" id="gcflag"></span><input id="gcsearch" autocomplete="off" placeholder="Type your country…"><span class="chev">▾</span></div>
      <div id="gclist" class="tl" style="display:none"></div>
    </div>
    <label id="gnlabel">Mobile number</label>
    <div class="fieldbox"><span class="fi" id="gnflag"></span><span class="prefix" id="gdial">+</span><input id="gn" inputmode="numeric" placeholder="phone number"></div>
    <div id="err"></div>
    <button class="btn" id="ggo">Send code</button>
    <div id="gadmin" style="margin-top:18px;background:var(--brand2);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;font-weight:800;cursor:pointer;letter-spacing:.2px">Ops team? Admin sign-in →</div>
  </div>`;
  let selected=null;
  const search=document.getElementById('gcsearch'), list=document.getElementById('gclist');
  const pick=(c)=>{ selected=c; search.value=c.name; list.style.display='none';
    const cl='fi fi-'+c.code.toLowerCase();
    const gcf=document.getElementById('gcflag'),gnf=document.getElementById('gnflag');
    gcf.textContent='';gnf.textContent=''; gcf.className=cl; gnf.className=cl;
    document.getElementById('gdial').textContent='+'+c.dial;
    document.getElementById('gnlabel').textContent = c.type==='opco' ? 'Mobile number' : 'Your mobile number (USDT account)';
    document.getElementById('gn').focus();
  };
  const draw=(q)=>{ const ql=q.trim().toLowerCase();
    const matches=DIR.filter(c=>c.name.toLowerCase().includes(ql)||('+'+c.dial).includes(ql)).slice(0,8);
    if(!matches.length){ list.style.display='none'; return; }
    list.innerHTML=matches.map((c,i)=>`<div class="tlrow" data-i="${i}"><span class="fi fi-${c.code.toLowerCase()}"></span><span>${c.name}</span>${c.type==='intl'?'<span class="usdtt">USDT</span>':''}<span class="d">+${c.dial}</span></div>`).join('');
    list.querySelectorAll('.tlrow').forEach((r,i)=>{ r.onmousedown=(e)=>{e.preventDefault();pick(matches[i]);}; });
    list.style.display='block';
  };
  search.oninput=()=>{ selected=null; document.getElementById('gcflag').className='fi'; document.getElementById('gcflag').textContent=''; draw(search.value); };
  search.onfocus=()=>{ draw(search.value); };
  search.onblur=()=>{ setTimeout(()=>{ list.style.display='none'; },150); };
  document.getElementById('ggo').onclick=async()=>{
    if(!selected) return err('Start typing and pick your country.');
    const national=document.getElementById('gn').value.replace(/\D/g,'').replace(/^0+/,'');
    if(!national) return err('Enter your number.');
    try{
      if(selected.type==='opco'){ const r=await POST('/api/auth/request-otp',{country:selected.code,national}); gateCode({country:selected.code,national}, r.devCode); }
      else { const msisdn=selected.dial+national; const r=await POST('/api/auth/request-otp',{intl:true,msisdn}); gateCode({intl:true,msisdn}, r.devCode); }
    }catch(e){ err(e.message); }
  };
  document.getElementById('gadmin').onclick=e=>{e.preventDefault();adminLogin();};
}
function gateCode(ctx,devCode){
  view.innerHTML=`<div class="panel" style="max-width:440px;margin:5vh auto 0">
    <h3>Enter your code</h3>
    <div class="small muted">Sent to your number.${devCode?` Demo code: <b>${devCode}</b>`:''}${ctx.intl?' · <b>International account</b>':''}</div>
    <label>6-digit code</label><input id="gco" inputmode="numeric" maxlength="6" placeholder="••••••" value="${devCode||''}">
    <div id="err"></div>
    <button class="btn" id="gv">Verify &amp; sign in</button>
    <button class="btn sec" id="gback">← Use a different number</button>
  </div>`;
  document.getElementById('gback').onclick=renderGate;
  document.getElementById('gv').onclick=async()=>{
    const code=document.getElementById('gco').value.trim();
    try{
      let v;
      if(ctx.intl){ v=await POST('/api/auth/verify-otp',{intl:true,msisdn:ctx.msisdn,code}); ME={intl:true,msisdn:v.msisdn}; }
      else { v=await POST('/api/auth/verify-otp',{country:ctx.country,national:ctx.national,code}); ME={country:ctx.country,national:ctx.national,msisdn:v.msisdn}; state.cc=ctx.country; }
      TOKEN=v.token; localStorage.setItem('momo_tok',TOKEN); localStorage.setItem('momo_me',JSON.stringify(ME));
      route();
      if(v.claimed&&v.claimed.length){ shell('Welcome — funds delivered',`<div class="msg ok">You had money waiting: ${v.claimed.map(c=>fmt(c.amount,c.currency)+' '+c.currency).join(', ')} delivered to your wallet.</div>`); }
    }catch(e){ err(e.message); }
  };
}
function adminLogin(){
  view.innerHTML=`<div class="panel" style="max-width:440px;margin:5vh auto 0">
    <h3>Admin sign-in</h3>
    <div class="small muted">Ops console — demo credentials are pre-filled.</div>
    <label>Username</label><input id="au" value="${DEMO_ADMIN.u}">
    <label>Password</label><input id="ap" type="password" value="${DEMO_ADMIN.p}">
    <div id="err"></div>
    <button class="btn" id="ago">Sign in</button>
    <button class="btn sec" id="aback">← Back to wallet sign-in</button>
  </div>`;
  document.getElementById('aback').onclick=renderGate;
  document.getElementById('ago').onclick=async()=>{
    try{ const r=await POST('/api/admin/login',{username:document.getElementById('au').value,password:document.getElementById('ap').value});
      ADMIN=r.token; localStorage.setItem('momo_admin',ADMIN); route(); }
    catch(e){ err(e.message); }
  };
}
function renderWallet(){
  const w=state.wallet; if(!w){view.innerHTML='<div class="panel muted">Loading…</div>';return;}
  const cy=document.getElementById('country'); if(cy)cy.value=state.cc;
  document.getElementById('topFlag').className='fi fi-'+state.cc.toLowerCase();
  document.getElementById('foot').innerHTML='Signed in to your phone-linked wallet on the momo-rail engine (mock MoMo adapter). Cross-border remittance (reserve now, deliver on signup), bill pay (MoMoPay / Paybill), payroll — one code path, every MTN market.';
  view.innerHTML=`
    <div class="cards">
      <div class="bal"><div class="lab">${w.name} wallet</div><div class="amt">${fmt(w.local,w.localCurrency)} <small>${w.localCurrency}</small></div>
        <div class="small muted" style="margin-top:6px">MoMo: ${w.operator} · 1 USDT = ${fmt(w.rate,w.localCurrency)} ${w.localCurrency}</div></div>
      <div class="bal usdt"><div class="lab">USDT wallet (shared)</div><div class="amt">${fmtU(w.usdt)} <small style="color:#bfe4dc">USDT</small></div>
        <div class="small" style="margin-top:6px;color:#bfe4dc">One dollar balance, every market</div></div>
    </div>
    <div class="actions">
      <button data-act="cashin"><span class="ic">📲</span>Cash in</button>
      <button data-act="convert"><span class="ic">⇄</span>Convert</button>
      <button data-act="cashout"><span class="ic">🏧</span>Cash out</button>
      <button data-act="remit"><span class="ic">🌍</span>Send abroad</button>
      <button data-act="bill"><span class="ic">🧾</span>Pay bill</button>
      <button data-act="payroll"><span class="ic">👥</span>Payroll</button>
    </div>
    <div class="panel"><h3>Recent activity</h3>${
      state.activity.length? state.activity.slice(0,8).map(a=>`<div class="row"><span>${a.text}</span><span class="small muted">${new Date(a.t).toLocaleTimeString()}</span></div>`).join('')
      :'<div class="muted small">Nothing yet — try a cash-in, then convert to USDT.</div>'}</div>`;
  view.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>openModal(b.dataset.act));
}
function opcoMarketsHtml(){
  return `<div class="panel"><h3>Opco Markets — directory</h3>
      <div class="small muted" style="margin-bottom:6px">16 MTN MoMo markets across 13 currencies, all served by one code path. Only <b>enabled</b> markets are available for customers to sign in.</div>
      <div style="overflow:auto"><table><thead><tr><th></th><th>Market</th><th>Currency</th><th>Rate / USDT</th><th>Operator</th><th>Status</th><th>Enabled</th></tr></thead><tbody>
      ${state.markets.map(m=>`<tr><td><span class="fi fi-${m.code.toLowerCase()}"></span></td><td>${m.name}</td><td>${m.ccy}</td><td>${fmt(m.rate,m.ccy)}</td><td class="small muted">${m.op}</td><td><span class="pill ${m.tested?'':'cfg'}">${m.tested?'wired':'config-ready'}</span></td><td><span class="pill ${m.enabled?'':'off'}">${m.enabled?'enabled':'disabled'}</span></td></tr>`).join('')}
      </tbody></table></div></div>`;
}
const FEATS=[['walletConvert','C'],['inboundRemittance','I'],['outboundRemittance','O'],['payroll','P'],['merchantPay','M']];
async function renderAdmin(){
  const H={headers:{Authorization:'Bearer '+ADMIN}};
  const sub=state.adminView||'console';
  const tb=(id,label)=>`<button class="${sub===id?'on':''}" data-atab="${id}">${label}</button>`;

  document.getElementById('foot').innerHTML='Admin ops console — monitor treasury and settlements, and configure/enable Opco markets. Enabled markets are the ones customers can sign in with on the landing page.';
  const tile=(lab,val)=>`<div style="flex:1;min-width:104px;background:var(--ice);border-radius:10px;padding:10px 12px"><div class="small muted" style="text-transform:uppercase;letter-spacing:.4px;font-size:.64rem">${lab}</div><div style="font-weight:800;font-size:1.15rem;margin-top:2px">${val}</div></div>`;

  // ---- Opco Markets: read-only directory ----
  if(sub==='markets'){
    try{ await loadMarkets(); }catch(e){}
    view.innerHTML=tabbar+opcoMarketsHtml();
    wireTabs(); return;
  }

  // ---- Configure Opcos: the writing editor (loaded on click) ----
  if(sub==='config'){
    let mk;
    try{ mk=await api('/api/admin/markets',H); await loadMarkets(); }
    catch(e){ ADMIN='';localStorage.removeItem('momo_admin');return route(); }
    state.admin=mk;
    const feat=(m,key,letter)=>`<label style="display:inline-flex;align-items:center;gap:1px;font-size:.7rem;margin:0"><input type="checkbox" class="ft" data-f="${key}" style="width:auto"${m.features[key]?' checked':''}>${letter}</label>`;
    const editor=`<div class="panel"><h3>Configure Opcos — writing console</h3>
      <div class="small muted" style="margin-bottom:8px">Each row is a market's live configuration. Edits take effect on the rail immediately and persist. Features: <b>C</b>onvert · <b>I</b>nbound remit · <b>O</b>utbound remit · <b>P</b>ayroll · <b>M</b>erchant pay.</div>
      <div style="overflow:auto"><table><thead><tr><th>Market</th><th>Adapter</th><th>Env</th><th>Convert</th><th>Remit</th><th>Per-tx max</th><th>Features</th><th>On</th><th></th></tr></thead><tbody>
      ${mk.map(m=>`<tr data-code="${m.code}">
        <td style="white-space:nowrap"><span class="fi fi-${m.code.toLowerCase()}"></span> ${m.code}·${m.ccy}</td>
        <td><select class="pk inp" style="padding:5px"><option value="momo_mock"${m.providerKey==='momo_mock'?' selected':''}>mock</option><option value="momo"${m.providerKey==='momo'?' selected':''}>live</option></select></td>
        <td><select class="env inp" style="padding:5px"><option value="sandbox"${m.providerEnv==='sandbox'?' selected':''}>sandbox</option><option value="production"${m.providerEnv==='production'?' selected':''}>prod</option></select></td>
        <td><input class="cfee" style="width:56px;padding:5px" value="${m.feeSchedule.convertRate}"></td>
        <td><input class="rfee" style="width:56px;padding:5px" value="${m.feeSchedule.remittanceRate}"></td>
        <td><input class="lim" style="width:104px;padding:5px" value="${m.limits.perTxMaxLocal}"></td>
        <td style="white-space:nowrap">${FEATS.map(([k,l])=>feat(m,k,l)).join(' ')}</td>
        <td><input type="checkbox" class="en"${m.enabled?' checked':''}></td>
        <td><button class="lnk save" style="border-color:var(--brand);color:var(--brand)">Save</button></td>
      </tr>`).join('')}
      </tbody></table></div><div id="err"></div></div>`;
    view.innerHTML=tabbar+editor;
    wireTabs();
    view.querySelectorAll('tr[data-code]').forEach(row=>{
      row.querySelector('.save').onclick=async()=>{
        const code=row.dataset.code, features={};
        row.querySelectorAll('.ft').forEach(cb=>features[cb.dataset.f]=cb.checked);
        try{ await POST('/api/admin/market/'+code,{
            enabled:row.querySelector('.en').checked,
            providerKey:row.querySelector('.pk').value,
            providerEnv:row.querySelector('.env').value,
            feeSchedule:{convertRate:parseFloat(row.querySelector('.cfee').value),remittanceRate:parseFloat(row.querySelector('.rfee').value)},
            limits:{perTxMaxLocal:row.querySelector('.lim').value},
            features
          },{Authorization:'Bearer '+ADMIN});
          const sb=row.querySelector('.save');sb.textContent='Saved ✓';setTimeout(()=>sb.textContent='Save',1200);
          await loadMarkets();
        }catch(e){document.getElementById('err').innerHTML=`<div class="msg err">${e.message}</div>`;}
      };
    });
    return;
  }

  // ---- Admin Opcos Console: the dashboard ----
  let ov,tr,inf,act;
  try{ [ov,tr,inf,act]=await Promise.all([
    api('/api/admin/overview',H),api('/api/admin/treasury',H),api('/api/admin/inflight',H),api('/api/admin/activity',H)]);
  }catch(e){ ADMIN='';localStorage.removeItem('momo_admin');return route(); }

  const overview=`<div class="panel"><h3>Overview</h3><div style="display:flex;gap:10px;flex-wrap:wrap">
    ${tile('Storage',ov.store)}${tile('Markets enabled',ov.enabled+' / '+ov.markets)}${tile('Live on MTN',ov.liveOnMtn)}${tile('Currencies',ov.currencies)}${tile('Wallets',ov.walletsSeeded)}</div></div>`;
  const treasury=`<div class="panel"><h3>Treasury — system balances</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      ${tile('USDT hot wallet',fmtU(tr.usdt.hotWallet)+' USDT')}${tile('USDT fee revenue',fmtU(tr.usdt.feeRevenue)+' USDT')}${tile('Remittance escrow',fmtU(tr.usdt.remitEscrow)+' USDT')}</div>
    <div style="overflow:auto"><table><thead><tr><th>Currency</th><th>Float</th><th>Fee revenue</th><th>Suspense</th><th>Biller pool</th></tr></thead><tbody>
    ${tr.local.map(r=>`<tr><td>${r.currency}</td><td>${fmt(r.float,r.currency)}</td><td>${fmt(r.feeRevenue,r.currency)}</td><td>${fmt(r.suspense,r.currency)}</td><td>${fmt(r.biller,r.currency)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="small muted" style="margin-top:6px">Float and hot-wallet balances are negative by convention — they're the pool that funds customer wallets (a liability owed out).</div></div>`;
  const inflight=`<div class="panel"><h3>In-flight</h3>
    <div class="small muted" style="margin-bottom:4px">Pending MoMo settlements: ${inf.pending.length} · Reserved remittances: ${inf.claims.length}</div>
    ${inf.pending.map(x=>`<div class="row"><span>${x.kind} · ${fmt(x.amountLocal,x.currency)} ${x.currency} <span class="pill res">${x.status}</span></span><span class="small muted">${x.countryCode}</span></div>`).join('')}
    ${inf.claims.map(c=>`<div class="row"><span>remit → +${c.destMsisdn} · ${fmtU(c.amountUsdt)} USDT <span class="pill res">reserved</span></span><span class="small muted">code ${c.code}</span></div>`).join('')}
    ${(!inf.pending.length&&!inf.claims.length)?'<div class="muted small">Nothing in flight.</div>':''}</div>`;
  const activity=`<div class="panel"><h3>System activity</h3>
    ${act.length?act.map(a=>`<div class="row"><span>${a.type}</span><span class="small muted">${a.amount?fmt(a.amount,a.currency)+' '+a.currency+' · ':''}${new Date(a.at).toLocaleTimeString()}</span></div>`).join(''):'<div class="muted small">No activity yet.</div>'}</div>`;

  view.innerHTML=tabbar+overview+treasury+inflight+activity;
  wireTabs();
}

const root=document.getElementById('modalRoot');
function close(){root.innerHTML='';}
function shell(title,inner){root.innerHTML=`<div class="backdrop"><div class="modal"><h3>${title}</h3>${inner}<button class="btn sec" id="mClose">Close</button></div></div>`;
  root.querySelector('.backdrop').onclick=e=>{if(e.target===root.querySelector('.backdrop'))close();};document.getElementById('mClose').onclick=close;}
function err(t){const e=document.getElementById('err');if(e)e.innerHTML=`<div class="msg err">${t}</div>`;}
function okmsg(t){const e=document.getElementById('err');if(e)e.innerHTML=`<div class="msg ok">${t}</div>`;}
async function act(btnId, fn){const b=document.getElementById(btnId);if(!b)return;b.onclick=async()=>{b.disabled=true;try{await fn();await refresh();}catch(e){err(e.message);b.disabled=false;}};}

function clearCustomer(){ TOKEN='';ME=null;localStorage.removeItem('momo_tok');localStorage.removeItem('momo_me'); }
async function signOut(){ try{await POST('/api/auth/logout',{});}catch(e){} clearCustomer(); state.view='wallet'; route(); }
function adminSignOut(){ ADMIN='';localStorage.removeItem('momo_admin'); route(); }
// Changing country = a different account for that market → confirm sign-out first.
function confirmSwitchCountry(chosen){
  const m=state.markets.find(x=>x.code===chosen);
  const revert=()=>{ const sel=document.getElementById('country'); if(sel) sel.value=state.cc; close(); };
  root.innerHTML=`<div class="backdrop"><div class="modal"><h3>Sign out to switch country?</h3>
    <div class="small muted" style="margin-top:6px">Your wallet is tied to your number in <b>${state.markets.find(x=>x.code===state.cc)?.name||state.cc}</b>. Switching to <b>${m?m.name:chosen}</b> is a different account, so you'll be signed out and returned to the sign-in screen for ${m?m.name:chosen}.</div>
    <button class="btn" id="csYes">Sign out &amp; switch</button>
    <button class="btn sec" id="csNo">Stay signed in</button></div></div>`;
  root.querySelector('.backdrop').onclick=e=>{ if(e.target===root.querySelector('.backdrop')) revert(); };
  document.getElementById('csNo').onclick=revert;
  document.getElementById('csYes').onclick=async()=>{
    try{ await POST('/api/auth/logout',{}); }catch(e){}
    clearCustomer(); state.cc=chosen; state.view='wallet'; close(); route();
  };
}

      const r=await POST('/api/bill/pay',{customer:CID,country:state.cc,billerCode:document.getElementById('bl').value,amount:v});
      okmsg(`Paid ${fmt(r.receipt.amount,r.receipt.currency)} ${r.receipt.currency} — ${r.receipt.billerName}.`);setTimeout(close,1100);});}
  if(a==='payroll'){shell(`Payroll — ${w.name} (MoMo Disbursements)`,`<div class="small muted">Pay many workers at once from your ${w.localCurrency} balance.</div><div id="rows" style="margin-top:10px"></div><button class="btn sec" id="add" style="margin-top:0">+ Add worker</button><div id="err"></div><button class="btn" id="go">Run payroll</button>`);
    const rows=document.getElementById('rows');const addRow=(ph,am)=>{const d=document.createElement('div');d.className='payrow';d.innerHTML=`<input placeholder="+${w.dial} phone" value="${ph||''}"><input inputmode="decimal" placeholder="amount" value="${am||''}"><button>✕</button>`;d.querySelector('button').onclick=()=>d.remove();rows.appendChild(d);};
    addRow('','');addRow('','');document.getElementById('add').onclick=()=>addRow();
    act('go',async()=>{const payees=[...rows.querySelectorAll('.payrow')].map(r=>{const i=r.querySelectorAll('input');return{ph:i[0].value.trim(),amt:+i[1].value};}).filter(x=>x.amt>0);
      if(!payees.length)throw new Error('Add at least one worker with an amount.');
      const r=await POST('/api/payroll',{customer:CID,country:state.cc,payees});
      okmsg(`Paid ${r.result.paid} worker${r.result.paid===1?'':'s'}${r.result.failed?`, ${r.result.failed} failed (insufficient balance)`:''}.`);setTimeout(close,1200);});}
}
document.getElementById('country').onchange=e=>{
  const chosen=e.target.value;
  if(TOKEN&&ME&&chosen!==state.cc){ confirmSwitchCountry(chosen); }
  else { state.cc=chosen; refresh(); }
};
(async()=>{try{await loadMarkets();if(ME&&ME.country)state.cc=ME.country;route();}catch(e){view.innerHTML=`<div class="panel msg err">${e.message}</div>`;}})();
</script>
